[project]
name = "cobertura-col"
version = "0.1.0"
description = "Deteccion de cobertura terrestre en Colombia con modelos de IA geoespaciales de codigo abierto"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "openvino>=2024.4",
    "numpy>=1.26",
    "rasterio>=1.3",
    "pystac-client>=0.7",
    "shapely>=2.0",
    "pyproj>=3.6",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "scikit-learn>=1.4",
]

[project.scripts]
cobertura-col = "cobertura_col.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cobertura_col"]
